name: MuleSoft SAPI CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and publish to Exchange
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Build and publish to Exchange
        run: >
          mvn --batch-mode clean deploy
          --settings .settings/settings.xml
          -DskipMunitTests
          -Dbusiness.group.id=1b09f0a8-fca0-4da3-87c7-a6cd5cb7174a
        env:
          CA_CLIENT_ID: 75094f2bdfeb4656a0c85c345996aa09
          CA_CLIENT_SECRET: FFBf1C1Eb4154889a51518703CcCDaC2

  deploy:
    name: Deploy to CloudHub 2.0
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Deploy to CloudHub 2.0
        run: >
          mvn --batch-mode clean package mule:deploy
          --settings .maven/settings.xml
          -DskipMunitTests
          -Dbusiness.group.id=1b09f0a8-fca0-4da3-87c7-a6cd5cb7174a
          -Dca.client.id=75094f2bdfeb4656a0c85c345996aa09
          -Dca.client.secret=FFBf1C1Eb4154889a51518703CcCDaC2
          -Dch.environment=Sandbox
          -Dplatform.client.id=f0f01b48a9e4438a87305926048ae7be
          -Dplatform.client.secret=Ca38E80081bD4e928955b1400c9D7DbD
          -Dmule.key=mule
          -Denv=dev
        env:
          CA_CLIENT_ID: 75094f2bdfeb4656a0c85c345996aa09
          CA_CLIENT_SECRET: FFBf1C1Eb4154889a51518703CcCDaC2
