name: Reusable Mule Build and Deploy

on:
  workflow_call:
    inputs:
      deploy:
        description: "true = also deploy to Runtime Manager, false = build and test only"
        type: boolean
        default: false
      anypoint_env:
        description: "Exact environment name in Anypoint (e.g. Dev, QA, Sandbox)"
        type: string
        default: Dev
      app_name:
        description: "Application name in Runtime Manager"
        type: string
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Maven access to Anypoint Exchange
        env:
          CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOT
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${CLIENT_ID}~?~${CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOT

      - name: Build and run MUnit tests
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-app
          path: target/*.jar

      - name: Deploy to Runtime Manager
        if: ${{ inputs.deploy }}
        env:
          CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          mvn -B deploy -DmuleDeploy -DskipTests \
            -Danypoint.client.id="$CLIENT_ID" \
            -Danypoint.client.secret="$CLIENT_SECRET" \
            -Danypoint.env="${{ inputs.anypoint_env }}" \
            -Dapp.name="${{ inputs.app_name }}"
