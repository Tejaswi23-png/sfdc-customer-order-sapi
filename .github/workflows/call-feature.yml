name: SAPI CI-CD

on:
  pull_request:
    branches:
      - dev
      - uat
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - dev
          - qa 
          - prod
        default: dev       

jobs:
  pipeline:
    uses: Tejaswi23-png/common-pipeline/.github/workflows/mulesoft-sapi-ci-cd.yml@main
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit
